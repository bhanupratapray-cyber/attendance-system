<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Portal Login</title>
    <style>
        /* Base Styling */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f7fa; }
        
        /* Main Login Box */
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        
        /* The Secret Trigger - Looks like normal text */
        .secret-header { font-size: 1.8rem; color: #2c3e50; margin-bottom: 30px; user-select: none; cursor: default; }
        
        /* Forms & Buttons */
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
        button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #2980b9; }

        /* Hidden Admin Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .admin-modal { background: #2c3e50; color: white; padding: 30px; border-radius: 10px; text-align: center; width: 300px; box-shadow: 0 0 20px #e74c3c; border: 2px solid #e74c3c; }
        .admin-modal h3 { margin-bottom: 20px; color: #e74c3c; }
        .admin-modal input { background: #34495e; color: white; border: 1px solid #7f8c8d; text-align: center; letter-spacing: 5px; font-weight: bold; }
        .admin-modal button { background-color: #e74c3c; }
        .admin-modal button:hover { background-color: #c0392b; }
        .close-btn { margin-top: 15px; background: transparent; color: #bdc3c7; border: 1px solid #bdc3c7; }
    </style>
</head>
<body>

    <!-- Standard Teacher Login -->
    <div class="login-box">
        <!-- THIS IS THE SECRET TRIGGER -->
        <h2 class="secret-header" onclick="triggerSecretGateway()">Teacher Portal</h2>
        
        <p style="color: #7f8c8d; margin-bottom: 20px;">Enter your ID and PIN to access your batch.</p>
        <input type="text" id="teacherId" placeholder="Teacher ID (e.g., TCH01)">
        <input type="password" id="teacherPin" placeholder="4-Digit PIN">
        <button onclick="loginTeacher()">Login to App</button>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
<p style="text-align: center; font-size: 0.8rem; color: #7f8c8d; margin-bottom: 10px;">First time on this device? Download college data below.</p>
<button id="btn-cloud-pull" onclick="pullFromCloud()" style="width: 100%; padding: 12px; background: #f39c12; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer;">☁️ Sync Device from Cloud</button>
    </div>

    <!-- Hidden Admin Gateway Modal -->
    <div class="modal-overlay" id="adminModalOverlay">
        <div class="admin-modal">
            <h3>⚠️ Restricted Area</h3>
            <p style="font-size: 0.8rem; margin-bottom: 15px;">Master Admin Verification Required</p>
            <input type="password" id="masterPin" placeholder="MASTER PIN">
            <button onclick="verifyAdmin()">Enter Control Center</button>
            <button class="close-btn" onclick="closeAdminGateway()">Cancel</button>
        </div>
    </div>

    <script>
        const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbx5v7obRt9h1iaom1av34ZmF6C2CIhNZTSC4NqfTXhTum3aEfku5ee5J04bCIGy1g/exec";
        // --- 1. THE 5-CLICK LOGIC (Upgraded Timer) ---
        let clickCount = 0;
        let clickTimer;

        function triggerSecretGateway() {
            clickCount++;
            
            // Increased to 4 seconds to make clicking easier!
            if (clickCount === 1) {
                clickTimer = setTimeout(() => {
                    clickCount = 0; 
                }, 4000); 
            }

            if (clickCount === 5) {
                clearTimeout(clickTimer); 
                clickCount = 0; 
                document.getElementById('adminModalOverlay').style.display = 'flex'; 
            }
        }

        function closeAdminGateway() {
            document.getElementById('adminModalOverlay').style.display = 'none';
            document.getElementById('masterPin').value = '';
        }

        // --- 2. ADMIN AUTHENTICATION ---
        function verifyAdmin() {
            const pinEntered = document.getElementById('masterPin').value;
            const MASTER_PIN = "Bhanu@2000"; 

            if (pinEntered === MASTER_PIN) {
                window.location.href = "admin.html"; 
            } else {
                alert("ACCESS DENIED: Incorrect Master PIN");
                document.getElementById('masterPin').value = '';
            }
        }

        // --- 3. TEACHER LOGIN LOGIC (Connected to Vault!) ---
        function loginTeacher() {
            const enteredId = document.getElementById('teacherId').value.trim();
            const enteredPin = document.getElementById('teacherPin').value.trim();

            if(!enteredId || !enteredPin) {
                alert("Please enter both your Teacher ID and PIN.");
                return;
            }

            // 1. Open the Admin Vault from Local Storage
            const vaultData = localStorage.getItem('adminVault');
            
            if (!vaultData) {
                alert("System Error: No teachers have been authorized yet. Please create an account in the Admin Control Center.");
                return;
            }

            const adminVault = JSON.parse(vaultData);

            // 2. Search for the Teacher ID
            const foundTeacher = adminVault.teachers.find(teacher => teacher.id === enteredId);

            if (foundTeacher) {
                // 3. Check if PIN matches
                if (foundTeacher.pin === enteredPin) {
                    
                    // SUCCESS! Save the "Active Session" so index.html knows who logged in
                    localStorage.setItem('activeTeacherSession', JSON.stringify(foundTeacher));
                    
                    // Redirect to the actual app
                    window.location.href = "index.html"; 
                } else {
                    alert("Invalid PIN. Please try again.");
                }
            } else {
                alert("Teacher ID not found. Please check your spelling.");
            }
        }
        async function pullFromCloud() {
    const btn = document.getElementById('btn-cloud-pull');
    btn.innerText = "Downloading...";
    btn.disabled = true;

    try {
        const response = await fetch(GOOGLE_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "pullConfig" })
        });
        const result = await response.json();
        
        if (result.status === 'success') {
            // Save the downloaded data to the phone's local storage
            if (result.teachers) localStorage.setItem('adminVault', result.teachers);
            if (result.students) localStorage.setItem('studentVault', result.students);
            
            alert("✅ Device synced successfully! You can now log in.");
        }
    } catch (err) {
        alert("❌ Download Failed. Check your internet connection.");
    } finally {
        btn.innerText = "☁️ Sync Device from Cloud";
        btn.disabled = false;
    }
}
    </script>
</body>
</html>
