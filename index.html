<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Attendance App</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-container">

        <!-- === SCREEN 1: THE SETUP SCREEN === -->
        <div id="setup-screen" class="hidden">
            <div class="setup-box">
                <h2>Class Setup</h2>

                <div id="sync-banner" class="sync-clear">
                    <span id="sync-text">☁️ All data synced</span>
                    <button id="btn-sync" class="hidden">Sync Now</button>
                </div>
                
                <label for="date-picker">Date</label>
                <input type="date" id="date-picker">

                <label for="batch-select">Select Batch</label>
                <select id="batch-select">
                    <!-- JavaScript will automatically build this based on the teacher's profile -->
                </select>

                <button id="btn-start">Start Attendance</button>
            </div>
        </div>

       <!-- === SCREEN 2: THE ATTENDANCE SCREEN === -->
       <div id="attendance-screen" class="hidden">
            <header style="position: relative;">
                <button id="btn-home" style="position: absolute; top: 15px; left: 15px; background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 5px;">🏠</button>
                <button id="btn-show-map" style="position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 5px;">▦</button>
                <h2 id="class-title">Batch Name</h2>
                <p id="date-display">Date</p>
            </header>

            <main>
                <!-- Rapid Entry Box -->
                <div id="rapid-entry-container" style="width: 100%; max-width: 400px; margin-bottom: 20px; display: flex; gap: 10px;">
                    <input type="text" id="rapid-roll-input" placeholder="e.g. 1 4 5 12" style="flex: 1; padding: 12px; border-radius: 8px; border: 2px solid #1a73e8; font-size: 1rem; outline: none;">
                    <button id="btn-rapid-present" style="background-color: #28a745; color: white; padding: 12px 20px; font-size: 0.9rem;">Mark Present</button>
                </div>

                <div id="flashcard" class="card-default">
                    <span id="serial-number">--</span> 
                    <h1 id="student-name">Student Name</h1>
                    <p id="enrollment-number">0706py25xxxx</p>
                    <h2 id="status-indicator">Absent</h2>
                </div>
            </main>

            <footer>
                <button id="btn-previous">Previous</button>
                <button id="btn-leave">Leave</button>
                <button id="btn-next">Next</button>
            </footer>
        </div>

        <!-- === SCREEN 3: REVIEW & MAP SCREEN === -->
        <div id="review-screen" class="hidden" style="padding: 20px; flex-grow: 1; display: flex; flex-direction: column; background-color: #f8f9fa;">
            <header style="text-align: center; margin-bottom: 20px; color: #333;">
                <h2>Class Review</h2>
                <p id="review-status-text" style="color: #666; font-weight: bold;">🔒 Review Mode (Locked)</p>
            </header>

            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; gap: 10px;">
                <button id="btn-toggle-edit" style="flex: 1; background: #ffc107; padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: #333; cursor: pointer;">Unlock Edit Mode</button>
                <button id="btn-toggle-view" style="flex: 1; background: #17a2b8; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Show List</button>
            </div>

            <div id="attendance-map" class="grid-container"></div>
            <div id="attendance-list" class="list-container hidden"></div>

            <div style="text-align: center; margin-top: auto; padding-top: 20px;">
                <button id="btn-final-save" style="background: #28a745; color: white; padding: 15px 40px; border: none; border-radius: 8px; font-size: 1.2rem; width: 100%; max-width: 400px; font-weight: bold; cursor: pointer;">Submit to Vault</button>
            </div>
        </div>

    </div>

    <!-- Keep your external script -->
    <script src="script.js"></script>

    <!-- The Security Guard & Setup Logic -->
   <script>
        console.log("Diagnostic: App is starting...");

        function checkSecurity() {
            const sessionData = localStorage.getItem('activeTeacherSession');
            
            if (!sessionData) {
                alert("Security Alert: No active session found. Redirecting to login.html");
                window.location.href = "login.html"; 
                return;
            }

            const currentTeacher = JSON.parse(sessionData);
            console.log("Diagnostic: Logged in as " + currentTeacher.id);

            // WAKE UP THE APP!
            const setupScreen = document.getElementById('setup-screen');
            if (setupScreen) {
                setupScreen.classList.remove('hidden');
                console.log("Diagnostic: Setup screen revealed.");
            } else {
                alert("Error: Could not find setup-screen element in HTML!");
            }

            // --- BATCH DROPDOWN BUILDER ---
            const batchDropdown = document.getElementById('batch-select');
            if(batchDropdown) {
                batchDropdown.innerHTML = ''; 
                let assignedBatches = Array.isArray(currentTeacher.batch) ? currentTeacher.batch : [currentTeacher.batch];

                assignedBatches.forEach(batch => {
                    let newOption = document.createElement('option');
                    newOption.value = batch;
                    newOption.innerText = batch;
                    batchDropdown.appendChild(newOption);
                });
                
                if (assignedBatches.length === 1) batchDropdown.disabled = true; 
            }
        }

        // Try to run the startup
        try {
            checkSecurity();
        } catch (err) {
            alert("CRITICAL ERROR in checkSecurity: " + err.message);
        }
    </script>
</body>
</html>
